name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair projeto Android
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q android-project.zip -d extracted
          test -f extracted/GBA-Zombie-Apocalypse-v1.2.0-Android-Project/settings.gradle

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compilar APK de teste
        working-directory: extracted/GBA-Zombie-Apocalypse-v1.2.0-Android-Project
        run: gradle :app:assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: GBA-Zombie-Apocalypse-v1.2.0-debug-apk
          path: extracted/GBA-Zombie-Apocalypse-v1.2.0-Android-Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
