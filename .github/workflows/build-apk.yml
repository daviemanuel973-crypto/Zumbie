name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Reconstruir arquivos do jogo
        run: |
          mkdir -p app/src/main/assets/src
          cat payload/game-bundle.part*.b64 > game-bundle.js.gz.b64
          base64 --ignore-garbage --decode game-bundle.js.gz.b64 > game-bundle.js.gz
          gzip -t game-bundle.js.gz
          gzip -dc game-bundle.js.gz > app/src/main/assets/src/game-bundle.js
          test -s app/src/main/assets/src/game-bundle.js
          node --check app/src/main/assets/src/game-bundle.js

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compilar APK de teste
        run: gradle :app:assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: GBA-Zombie-Apocalypse-v1.2.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
